name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: brew install ldid dpkg make
      - name: theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth=1 https://github.com/theos/sdks.git "$HOME/sdks"
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME"/sdks/*.sdk "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: build
        run: |
          chmod 755 layout/DEBIAN/postinst layout/DEBIAN/prerm
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          make package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: LainBridge-deb
          path: packages/*.deb
